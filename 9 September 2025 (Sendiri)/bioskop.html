<script>

            sinopsis=`Film Conjuring yang konon disebut-sebut sebagai babak terakhir ini dibuka dengan Lorraine dan Ed muda saat mereka menanti kelahiran anak mereka, Judy.
Teror dan keajaiban hadir di malam yang sama-yang membuat pasangan ini mempunyai ikatan yang kuat dengan anak mereka. Pembukaan ini adalah alasan kenapa Lorraine (Vera Farmiga) dan Ed (Patrick Wilson) sangat protektif dengan Judy (Mia Tomlinson).
Dan setelah apa yang terjadi dengan Ed di film sebelumnya, pasangan ini memutuskan untuk tidak lagi turut serta dalam proses pengusiran setan.
Masalahnya adalah sebuah keluarga baru saja terkena teror yang tidak ada hentinya. Keluarga Smurl seperti di film Conjuring pertama adalah sebuah keluarga besar yanvg bahagia.
Mereka bukan keluarga yang kaya tapi mereka sangat akrab dengan satu sama lain. Setiap jengkal rumah mereka diisi tawa dan kehangatan. Semuanya berubah ketika cermin terkutuk hadir dan mulai menghantui seisi rumah satu per satu.


`
        }else if(selectValue ==="film2"){
            imgElement.src='gambar2.png'
            harga=50000

            sinopsis=`Seorang pria tiba-tiba terjebak di lorong bawah tanah stasiun yang seakan tak berujung. Satu-satunya jalan keluar adalah menemukan Exit 8. Namun ada aturan yang harus dipatuhi: setiap kali melihat sesuatu yang aneh, ia harus segera berbalik. Jika tidak, ia akan kembali ke titik awal dan terjebak dalam lingkaran tanpa akhir.

Dalam perjalanan, ia berulang kali bertemu sosok-sosok misterius—seorang pria yang hanya berdiri diam, seorang wanita asing, dan bayangan lain yang tak bisa dijelaskan. Situasi itu membuat batas antara realitas dan ilusi makin kabur.

Film horor psikologis Jepang ini diadaptasi dari game indie viral The Exit 8, yang terkenal karena atmosfer mencekam dan konsep loop tak berujung. Tanpa mengandalkan jumpscare berlebihan, film ini menekan mental penonton dengan suasana asing yang terasa akrab, membuat semua orang bertanya-tanya: apakah benar-benar ada jalan keluar?`
        }else if (selectValue ==="film3"){
imgElement.src='gambar3.png'
            harga=50000

sinopsis=`“The Long Walk” bercerita tentang sebuah perjalanan panjang yang mempertemukan manusia dengan batas ketahanan fisik, waktu, dan takdir.

Di satu sisi, kisahnya mengikuti seratus pemuda yang dipaksa ikut dalam sebuah kontes berjalan mematikan. Mereka harus terus melangkah tanpa henti, dengan aturan sederhana namun kejam: siapa pun yang berhenti atau melambat akan ditembak mati di tempat. Dari awal, perjalanan ini bukan sekadar lomba, melainkan bentuk hiburan bagi rezim penguasa yang kejam. Seiring langkah demi langkah, satu per satu peserta tumbang, menyisakan hanya sedikit yang masih mampu bertahan. Tokoh utama, Ray Garraty, bukan hanya berjuang melawan rasa sakit, haus, dan lelah, tapi juga melawan dirinya sendiri—antara keinginan untuk hidup, rasa takut akan kematian, dan pertanyaan apakah kemenangan yang dijanjikan benar-benar sepadan dengan harga yang harus dibayar.

Namun di sisi lain, perjalanan panjang itu juga bisa dilihat melalui kisah seorang pria tua di Laos, yang hidup ditemani oleh arwah perempuan yang tewas di jalan bertahun-tahun lalu. Dari arwah itu, ia menemukan kemampuan untuk menembus alur waktu. Dengan melangkah ke masa lalu, ia mencoba memperbaiki keputusan-keputusan yang menjerat hidupnya dalam penyesalan: hubungan dengan ibunya, kesepian masa mudanya, hingga perasaan bersalah yang tak pernah usai. Tapi semakin jauh ia berjalan dalam waktu, semakin jelas terlihat bahwa mengubah masa lalu bukanlah jalan menuju kebebasan, melainkan jebakan yang penuh konsekuensi kelam.

Pada akhirnya, “The Long Walk” menjadi metafora tentang hidup itu sendiri: sebuah perjalanan yang tak bisa berhenti, penuh penderitaan dan pilihan sulit. Entah itu dalam bentuk lomba berdarah yang hanya menyisakan satu pemenang, atau perjalanan spiritual yang menembus batas waktu, keduanya sama-sama menyingkap pertanyaan besar: seberapa jauh manusia mampu berjalan untuk melawan takdir, dan apakah kemenangan sejati itu benar-benar ada?`
        }else if(selectValue === "film4"){
imgElement.src='gambar4.png'
            harga=50000

sinopsis=`“Jumbo” mengisahkan Don, seorang anak yatim piatu yang akrab dipanggil Jumbo karena tubuhnya gempal. Sehari-hari ia menjadi sasaran ejekan dan perundungan teman-temannya, tetapi satu-satunya harta berharga yang ia miliki adalah sebuah buku dongeng berjudul Pulau Gelembung—warisan dari orang tuanya, beserta sebuah lagu ciptaan sang ibu yang penuh kenangan.

Suatu hari, Don memutuskan untuk tampil di pentas seni sekolah, menampilkan kisah dari buku itu lengkap dengan lagu ibunya. Bagi Don, ini adalah cara untuk membuktikan bahwa dirinya bukan sekadar bahan olokan, melainkan anak yang berani dan penuh imajinasi. Namun, rencananya hancur ketika buku dongeng itu dicuri oleh Atta, seorang pembuli yang ingin menjatuhkannya.

Di tengah keputusasaan, Don bersama dua sahabatnya—Mae dan Nurman—bertemu dengan Meri, arwah seorang gadis kecil yang meminta tolong agar makam keluarganya diperbaiki. Pertemuan itu menuntun mereka pada sebuah petualangan tak terduga: mencuri kembali buku yang hilang, membantu Meri menemukan ketenangan, sekaligus mengumpulkan keberanian untuk berdiri di atas panggung.

Perjalanan Don menjadi kisah tentang keberanian menghadapi rasa takut, arti persahabatan, serta cinta yang tetap hidup meski orang yang dicintai telah tiada. Dengan imajinasi, tekad, dan dukungan sahabat, Jumbo belajar bahwa kemenangan terbesar bukanlah melawan para pembuli, melainkan menemukan keberanian untuk menjadi dirinya sendiri.`
        }else if (selectValue ==="film5"){
            imgElement.src='gambar5.png'
            harga=50000

            sinopsis =`Ejen Ali yang kini sudah lebih matang kembali menghadapi tantangan besar ketika Projek Satria, satu set baju zirah super canggih hasil riset MATA, diperkenalkan. Ali dipercaya sebagai agen pertama untuk menguji teknologi baru ini. Namun, misi ini lebih rumit dari sekedar peluncuran—Ali harus berhadapan dengan ancaman penjahat siber yang ingin menghancurkan sistem kota Cyberaya. Di luar konflik eksternal tersebut, Ali juga bergulat dengan konflik internal: rasa takut, tanggung jawab besar, dan keraguan diri menambah intensitas perjuangannya. Dalam peluncuran ini, ia bukan hanya menguji kekuatan Satria, tapi juga kekuatan dalam dirinya sendiri`
        }
        else if (selectValue ==="film6"){
            imgElement.src='gambar6.png'
            harga=50000

sinopsis = `Setelah peristiwa besar yang menghancurkan tubuhnya, Ne Zha dan sahabatnya Ao Bing hanya tersisa dalam bentuk roh. Dikuatkan oleh guru mereka, Taiyi Zhenren, mereka direkonstruksi kembali menggunakan Bunga Teratai Berwarna Tujuh, tetapi tubuh baru itu rapuh dan penuh tantangan. Perjalanan mereka dipenuhi ujian berbahaya—dengan konflik antara klan naga dan dunia manusia—yang menguji identitas, ikatan, dan tujuan hidup mereka. Dalam pertarungan besar melawan ancaman kuno yang ingin menghancurkan umat manusia, Ne Zha bergaung penuh untuk menjadi pahlawan sejati, sementara Ao Bing bergulat dengan identitasnya sebagai roh dan manusia.`
        }else if (selectValue ==="film7"){
            imgElement.src='gambar7.png'
            sinopsis=`Erwin, seorang profesional sukses dan anak bungsu, hidup tenang bersama kekasihnya, Natalie. Tapi semuanya berubah ketika ayahnya, Koh Afuk, sakit dan memutuskan memberikan toko kelontong keluarga kepada Erwin—bukan kepada kakaknya, Yohan, yang merasa layak. Erwin ragu karena kariernya sedang menanjak dan Natalie tidak setuju. Namun dengan bujukan ayahnya, ia menerima tantangan: mengelola toko selama sebulan uji coba. Konflik keluarga, tanggung jawab, dan realitas kehidupan pun menyatu dalam drama komedi hangat tentang warisan, tanggung jawab, dan arti keluarga`
            harga=50000

        }else if (selectValue ==="film8"){
            imgElement.src='gambar8.png'
            harga=50000

            sinopsis=`Merah Putih: One for All dibuka di sebuah desa yang tenang, tengah bersiap menyemarakkan perayaan HUT RI—merayakan Indonesia merdeka yang ke-80. Di tengah gegap gempita itu, terbentuklah sebuah kelompok istimewa bernama "Tim Merah Putih", yang terdiri dari delapan anak dari berbagai latar budaya: Betawi, Papua, Medan, Tegal, Jawa Tengah, Makassar, Manado, dan keturunan Tionghoa Tugas mereka sangat sakral: menjaga Bendera Pusaka Merah Putih yang akan dikibarkan saat upacara 17 Agustus Namun, tragedi kecil pun muncul — tiga hari sebelum upacara, bendera itu menghilang secara misterius dari gudang desa bercita-cita menyelamatkan simbol nasionalitas ini pun bersatu. Mereka memulai petualangan lintas alam: menyeberangi sungai deras, menjelajahi hutan lebat, menghadapi badai, bahkan menyelamatkan seekor burung beo di tengah perjalanan Dalam misi penuh tantangan ini, setiap anak belajar untuk saling memahami dan meredam ego masing-masing. Dari perbedaan tradisi dan kebiasaan, mereka menemukan kekuatan dalam kebersamaan—bahwa keberagaman tidak melebarkan jurang, tapi menjadi fondasi persatuan Dengan keberanian dan kerja sama yang tumbuh, mereka akhirnya berhasil menemukan dan meraih kembali bendera pusaka untuk dikibarkan tepat pada waktunya Film ini sarat dengan momen heroik, lucu, dan menyentuh—menyiratkan betapa cinta tanah air dan semangat nasionalisme bisa menyatukan anak-anak lintas budaya untuk tujuan mulia`
        }else if(selectValue ==="film9"){
            harga=50000
imgElement.src='gambar10.png'
sinopsis=`Imperfect (2019)

Film komedi-drama karya Ernest Prakasa ini bercerita tentang Rara, seorang perempuan cerdas yang bekerja di perusahaan kosmetik. Berbeda dengan adiknya yang cantik dan langsing, Rara bertubuh besar dan sering merasa minder dengan penampilannya. Di tengah usahanya mengejar promosi kerja, ia dipaksa untuk menurunkan berat badan agar sesuai standar “cantik” di perusahaannya. Hal ini membuat hubungan Rara dengan pacarnya, Dika, juga ikut terguncang. Film ini menyoroti isu body shaming, kepercayaan diri, serta bagaimana cinta dan penerimaan sejati bukan bergantung pada penampilan luar, melainkan hati.`
        }else{
            harga=50000
imgElement.src='gambar9.png'
sinopsis=`Miracle in Cell No.7 (2022, Indonesia)

Adaptasi dari film Korea populer, versi Indonesia ini mengisahkan Dodo Rozak, seorang ayah dengan keterbelakangan mental yang sangat menyayangi putrinya, Kartika. Hidup mereka sederhana namun penuh kasih sayang. Suatu hari, Dodo dituduh melakukan kejahatan yang tidak ia lakukan dan dijebloskan ke penjara. Di balik jeruji, ia mendapat teman-teman sesama napi yang akhirnya membantu menyatukan kembali Dodo dengan Kartika secara diam-diam. Kisah ini sarat dengan momen haru, tawa, sekaligus kritik sosial tentang keadilan. Pada akhirnya, film ini menegaskan bahwa cinta seorang ayah tidak terbatas ruang maupun keadaan.`
        }
        document.getElementById('harga').textContent ="Rp"+harga;
         document.getElementById('sinopsis').textContent =sinopsis;
    })
function hitung(){
    let j_tiket = parseFloat(document.getElementById('j_tiket').value);
    let bayar = harga*j_tiket
    const format = bayar.toLocaleString('id-ID');
document.getElementById('bayar').textContent=`Rp${format}`;
  if(isNaN(j_tiket)){
document.getElementById('bayar').textContent="Masukkan Jumlah Tiket nya Dahulu!"
return;
  }else if(j_tiket <=0){
    document.getElementById('bayar').textContent="Tiket Tidak Bisa Di hitung"
    return;
  }


}
